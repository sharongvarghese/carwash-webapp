{% extends "base.html" %}
{% block title %}Gallery - Golden Touch{% endblock %}

{% block content %}

<section class="section-dark container py-5 mt-5">

  <div class="glass-card glass-glow">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="section-title mb-0">Our Works</h2>
      <a href="{{ url_for('public.home') }}" class="see-all-link">
        ← Back
      </a>
    </div>

    <div class="gallery-grid">

      {% for item in gallery_items %}
      <div class="gallery-card-wrapper">

        <div class="gallery-card-overlay"
             data-before="{{ url_for('static', filename=item.before_image) }}"
             data-after="{{ url_for('static', filename=item.after_image) }}">

          <img src="{{ url_for('static', filename=item.before_image) }}"
               class="gallery-image-overlay"
               alt="Before and After Work">

          <div class="gallery-badge before active">BEFORE</div>
          <div class="gallery-badge after">AFTER</div>
        </div>

        {% if item.caption %}
        <div class="gallery-description">
          {{ item.caption }}
        </div>
        {% endif %}

      </div>
      {% endfor %}

    </div>

  </div>

</section>

{% endblock %}
