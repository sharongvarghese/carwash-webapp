{% extends "base.html" %}
{% block title %}Our Services{% endblock %}
{% block content %}

<section class="section-dark container py-5 mt-5">

  <h2 class="section-title text-center mb-5">Our Services</h2>

  <div class="services-row">

    {% for service in services %}
    <a href="{{ url_for('public.service_detail', service_id=service.id) }}"
           class="service-link">
    <div class="service-card service-card-page service-card-list">

      <img src="{{ url_for('static', filename=service.image_url) }}"
           class="service-img"
           alt="{{ service.name }}">

      <div class="service-title-box">
        <p class="service-title">{{ service.name }}</p>
      </div>

    </div>
    </a>
    {% endfor %}

  </div>

</section>

{% endblock %}
