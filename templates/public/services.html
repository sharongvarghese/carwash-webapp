{% extends "base.html" %}

{% block content %}

<section class="section-dark container py-5 mt-5">

  <!-- Page Header -->
  <div class="services-page-header">
    <span class="services-badge">Premium Quality</span>
    <h2 class="section-title services-page-title">Our Services</h2>
    <p class="services-page-subtitle">Experience the golden standard in car care</p>
  </div>

  <!-- Services Grid -->
  <div class="services-page-grid">

    {% for service in services %}
    <div class="service-card-wrapper">
      <a href="{{ url_for('public.service_detail', service_id=service.id) }}"
         class="service-link">

        <div class="service-card service-card-modern service-card-page">

          <!-- Image Container -->
          <div class="service-image-container">
            <img src="{{ url_for('static', filename=service.image_url) }}"
                 class="service-img"
                 alt="{{ service.name }}">
            <div class="service-overlay">
              <span class="service-view-btn">View Details</span>
            </div>
          </div>

          <!-- Content -->
          <div class="service-content">
            <h3 class="service-title-modern">{{ service.name }}</h3>
            <div class="service-features">
              <span class="service-feature-item">
                <i class="bi bi-check-circle-fill"></i>
                Professional
              </span>
              <span class="service-feature-item">
                <i class="bi bi-check-circle-fill"></i>
                Fast Service
              </span>
            </div>
          </div>

          <!-- Shine Effect -->
          <div class="service-shine"></div>

        </div>

      </a>
    </div>
    {% endfor %}

  </div>

</section>

{% endblock %}
