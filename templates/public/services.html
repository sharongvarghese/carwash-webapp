{% extends "base.html" %}
{% block title %}All Services - Golden Touch{% endblock %}

{% block content %}
<div class="container py-5 mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="section-title mb-0">All Services</h2>

  <a href="{{ url_for('public.home') }}" class="see-all-link">
    ← Back
  </a>
</div>
  <div class="services-row">
    {% for service in services %}
      <div class="service-card">

        <img src="{{ url_for('static', filename=service.image_url) }}"
             class="service-img"
             alt="{{ service.name }}">

        <div class="service-title-box">
          <p class="service-title">{{ service.name }}</p>
        </div>

        <button class="btn btn-gold w-100 mt-2" disabled>
          Available
        </button>

      </div>
    {% endfor %}
  </div>

</div>
{% endblock %}
